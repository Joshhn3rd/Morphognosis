{% set path = request.path %}

<header class="site-header">

    <div class="header-inner">

        <a class="brand" href="/" aria-label="Morphognosis home">
            <img class="brand-logo"
                 src="{{ url_for('static', filename='images/logo.svg') }}"
                 alt="" />
            <span class="brand-name">Morphognosis</span>
        </a>

        <nav class="main-nav" aria-label="Main">
            <a href="/" {% if path == '/' %}class="is-active" aria-current="page"{% endif %}>Home</a>
            <a href="/prediction" {% if path.startswith('/prediction') %}class="is-active" aria-current="page"{% endif %}>Plant Prediction</a>
            <a href="/history" {% if path.startswith('/history') %}class="is-active" aria-current="page"{% endif %}>Prediction History</a>
        </nav>

        <div class="header-auth">

            {% if current_user %}

                <span class="user-chip" title="{{ current_user.username }}">{{ current_user.username }}</span>

                <form method="post" action="/logout" class="auth-inline-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
                    <button type="submit" class="pill-btn">Sign out</button>
                </form>

            {% else %}

                <a href="/login" class="auth-text-link">Sign in</a>
                <a href="/signup" class="pill-btn">Sign up</a>

            {% endif %}

        </div>

    </div>

</header>
